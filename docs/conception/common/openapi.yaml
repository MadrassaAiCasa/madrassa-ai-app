openapi: 3.0.3
info:
    title: Madrassa AI Auth API
    version: 1.0.0
    description: Authentication and session management endpoints

servers:
    - url: /auth
      description: Auth server

paths:
    /login:
        post:
            operationId: login
            summary: Authenticate user
            description: Validates credentials and issues an access token + refresh token cookie.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginRequest'
                        examples:
                            withUsername:
                                summary: Login with username
                                value:
                                    username: admin
                                    password: password123
                            withEmail:
                                summary: Login with email
                                value:
                                    email: admin@madrassa.ai
                                    password: password123
            responses:
                '200':
                    description: Login successful
                    headers:
                        Set-Cookie:
                            schema:
                                type: string
                                example: refreshToken=abc123; HttpOnly; SameSite=Strict; Path=/
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LoginResponse'
                '400':
                    description: Missing required fields
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                            example:
                                error: Username or email required
                '401':
                    description: Invalid credentials
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                            example:
                                error: Invalid credentials

    /session:
        get:
            operationId: getSession
            summary: Get current session
            description: Validates the refresh token cookie and returns the current user and token expiry.
            parameters:
                - name: Cookie
                  in: header
                  description: refreshToken cookie
                  required: true
                  schema:
                      type: string
                      example: refreshToken=abc123
            responses:
                '200':
                    description: Session valid
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SessionResponse'
                '401':
                    description: No token or expired
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                            example:
                                error: No refresh token

    /refresh:
        post:
            operationId: refreshToken
            summary: Refresh access token
            description: Validates the refresh token cookie, rotates it, and issues a new access token.
            parameters:
                - name: Cookie
                  in: header
                  description: refreshToken cookie
                  required: true
                  schema:
                      type: string
                      example: refreshToken=abc123
            responses:
                '200':
                    description: Token refreshed
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RefreshResponse'
                '401':
                    description: No token or expired
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                            example:
                                error: No refresh token

    /logout:
        post:
            operationId: logout
            summary: Logout user
            description: Revokes the refresh token and clears the session.
            responses:
                '204':
                    description: Logout successful, no content

components:
    schemas:
        LoginRequest:
            type: object
            properties:
                username:
                    type: string
                    description: Username or email
                email:
                    type: string
                    format: email
                    description: Email address (alternative to username)
                password:
                    type: string
                    format: password
            required:
                - password
            oneOf:
                - required: [username, password]
                - required: [email, password]

        LoginResponse:
            type: object
            properties:
                accessToken:
                    type: string
                    description: JWT access token
                expiresAt:
                    type: string
                    format: date-time
                    description: ISO 8601 expiry timestamp

        SessionResponse:
            type: object
            properties:
                user:
                    $ref: '#/components/schemas/User'
                expiresAt:
                    type: string
                    format: date-time

        RefreshResponse:
            type: object
            properties:
                accessToken:
                    type: string
                    description: New JWT access token
                expiresAt:
                    type: string
                    format: date-time

        User:
            type: object
            properties:
                id:
                    type: string
                    description: User UUID
                username:
                    type: string
                email:
                    type: string
                    format: email
                roles:
                    type: array
                    items:
                        type: string
                    description: User roles (e.g. Admin, Teacher)
            required:
                - id
                - username
                - email
                - roles

        ErrorResponse:
            type: object
            properties:
                error:
                    type: string
            required:
                - error
